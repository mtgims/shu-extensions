# Types, lint and tests for each extension, and a check that the committed dist/ bundle (what
# the app installs) was rebuilt from the current source.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        extension: [audiobook-catalog, audiobook-scraper]
    defaults:
      run:
        working-directory: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.extension }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: dist/ matches the source
        run: |
          npm run build
          git diff --exit-code dist || {
            echo "::error::dist/ is out of date: run npm run build and commit the result"
            exit 1
          }
